<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2347c5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cüzdanım">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Cüzdanım Borç ve Bütçe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Düzen: tek kolon mobil uygulama; üstte başlık, altta 5'li sekme çubuğu ve ortada hızlı harcama düğmesi */
:root{
  --bg:#f1f4f2;--surface:#ffffff;--surface2:#e7ece9;--ink:#14211c;--muted:#5b6a63;--line:#dbe2de;
  --accent:#2347c5;--accent-ink:#ffffff;--accent-soft:#e3e9fb;
  --good:#16804a;--good-soft:#dff3e8;--warn:#a96a0a;--warn-soft:#faedd2;--bad:#c0352b;--bad-soft:#fbe3e0;
  --shadow:0 1px 2px rgba(20,33,28,.06),0 6px 20px rgba(20,33,28,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --c1:#2347c5;--c2:#e07a1f;--c3:#16804a;--c4:#b2399a;--c5:#0d8da8;--c6:#c0352b;--c7:#7a5af0;--c8:#8a8f1c;--c9:#d1578a;--c10:#5b6a63;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1210;--surface:#151e1a;--surface2:#1f2b25;--ink:#e8efeb;--muted:#92a39a;--line:#27352e;
  --accent:#8aa5ff;--accent-ink:#0c1210;--accent-soft:#1c2748;
  --good:#4cd28a;--good-soft:#14301f;--warn:#f0b84a;--warn-soft:#3a2d10;--bad:#ff7b72;--bad-soft:#3b1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --c1:#8aa5ff;--c2:#f2a05a;--c3:#4cd28a;--c4:#e07fcc;--c5:#52c4de;--c6:#ff7b72;--c7:#a994ff;--c8:#cfd45a;--c9:#f08fb4;--c10:#92a39a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1210;--surface:#151e1a;--surface2:#1f2b25;--ink:#e8efeb;--muted:#92a39a;--line:#27352e;
  --accent:#8aa5ff;--accent-ink:#0c1210;--accent-soft:#1c2748;
  --good:#4cd28a;--good-soft:#14301f;--warn:#f0b84a;--warn-soft:#3a2d10;--bad:#ff7b72;--bad-soft:#3b1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --c1:#8aa5ff;--c2:#f2a05a;--c3:#4cd28a;--c4:#e07fcc;--c5:#52c4de;--c6:#ff7b72;--c7:#a994ff;--c8:#cfd45a;--c9:#f08fb4;--c10:#92a39a;
  color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;border:0;background:none}
.num{font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding-bottom:120px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 0 10px}
.top h1{flex:1;margin:0;font-size:22px;font-weight:750;letter-spacing:-.02em;min-width:0}
.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.ib svg{width:22px;height:22px}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
section{margin-top:18px}
h2{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
h2 button{font-size:13px;color:var(--accent);text-transform:none;letter-spacing:0;font-weight:600}
.card{background:var(--surface);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.hero{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px}
.hero .lbl{font-size:12px;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.hero .big{font-size:36px;font-weight:780;letter-spacing:-.03em;margin:2px 0 10px}
.hero .sub{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero .sub div{background:rgba(127,127,127,.18);border-radius:12px;padding:8px 10px;min-width:0}
.hero .sub b{display:block;font-size:15px;font-weight:700;overflow-wrap:anywhere}
.hero .sub span{font-size:11px;opacity:.7}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.kpi span{font-size:11px;color:var(--muted);display:block}
.kpi b{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{font-weight:700;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pill{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted)}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}
.bar{height:8px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--accent)}
.bar.bad i{background:var(--bad)}.bar.warn i{background:var(--warn)}.bar.good i{background:var(--good)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:13px;font-weight:650;background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);background:var(--bad-soft)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.chip{padding:7px 12px;border-radius:99px;background:var(--surface2);font-size:13.5px;font-weight:550;white-space:nowrap;border:1.5px solid transparent;flex:none}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tip{display:flex;gap:10px;padding:12px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:8px;align-items:flex-start;width:100%;text-align:left}
.tip .sev{width:4px;align-self:stretch;border-radius:4px;background:var(--accent);flex:none}
.tip.bad .sev{background:var(--bad)}.tip.warn .sev{background:var(--warn)}.tip.good .sev{background:var(--good)}
.tip b{display:block;margin-bottom:2px}.tip span{font-size:13.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:22px 10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0;min-height:48px;justify-content:center}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--accent)}
.nav .fab{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);margin:-26px auto 0;box-shadow:0 6px 18px rgba(35,71,197,.4);padding:0;min-height:56px;justify-content:center}
.nav .fab svg{width:28px;height:28px;stroke-width:2.4}
#sheetBg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:100%;max-width:640px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));overscroll-behavior:contain}
#sheet h3{margin:0 0 12px;font-size:19px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.f input,.f select{width:100%;min-height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);appearance:none;-webkit-appearance:none}
.f input:focus,.f select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.f input[type=date]{min-width:0}
.amtin input{font-size:32px;font-weight:750;min-height:64px;letter-spacing:-.02em}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.prev{padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:13.5px;margin-bottom:12px}
.prev.warn{background:var(--warn-soft)}.prev.bad{background:var(--bad-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:13px;z-index:60;font-weight:600;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
.mn{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mn b{font-size:16px}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--surface);border-radius:16px;padding:14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:92px}
.menu button svg{width:26px;height:26px;color:var(--accent)}
.menu button b{font-size:15px}.menu button span{font-size:12px;color:var(--muted)}
.cardtile{background:var(--ink);color:var(--bg);border-radius:20px;padding:16px;width:100%;text-align:left;display:block}
.cardtile+.cardtile{margin-top:10px}
.cardtile .bar{background:rgba(127,127,127,.3)}
.cardtile .bar i{background:var(--bg)}
.cardtile .cn{font-weight:700;font-size:16px;display:flex;justify-content:space-between}
.cardtile .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.cardtile .g span{font-size:11px;opacity:.7;display:block}.cardtile .g b{font-size:15px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:10px;stroke:none;font-family:var(--font)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px}
.gms{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.gm{background:var(--surface2);border-radius:11px;padding:7px 2px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--muted);position:relative;border:1.5px solid transparent;min-height:50px}
.gm b{font-size:13px;color:var(--ink)}.gm.p{background:var(--good-soft);color:var(--good)}.gm.p b{color:var(--good)}.gm.p::after{content:"✓";position:absolute;top:2px;right:5px;font-size:10px}
.gm.t{border-color:var(--accent)}.gm i{font-style:normal;font-size:9px;font-weight:800;color:var(--accent);letter-spacing:.04em}
textarea{width:100%;min-height:120px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px;font-size:16px}
@media (prefers-reduced-motion:no-preference){#sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:.6}}}
</style>
</head>
<body>

<div id="app"></div>
<nav class="nav" id="nav"></nav>
<div id="sheetBg" hidden><div id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>
<script>
'use strict';
/* ============ yardımcılar ============ */
const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>[...e.querySelectorAll(s)];
const MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const MS=['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const today=()=>iso(new Date());
const ymOf=d=>d.getFullYear()*12+d.getMonth();
const ymLabel=y=>MONTHS[y%12]+' '+Math.floor(y/12);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dateAt=(ym,day)=>{const y=Math.floor(ym/12),m=ym%12;return new Date(y,m,Math.min(day,dim(y,m)))};
const dshort=d=>pad(d.getDate())+' '+MS[d.getMonth()];
const midnight=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const daysTo=d=>Math.round((midnight(d)-midnight(new Date()))/864e5);
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=+n||0;const r=Math.abs(n-Math.round(n))<.005;return (n<-.004?'−':'')+Math.abs(n).toLocaleString('tr-TR',{minimumFractionDigits:r?0:2,maximumFractionDigits:r?0:2})+' ₺'};
const fmtI=n=>(n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('tr-TR')+' ₺';
const num=v=>{let s=String(v??'').trim().replace(/[₺\s]/g,'');if(!s)return 0;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?n:0};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const sum=(a,f=x=>x)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const CATS=['Market','Yemek','Ulaşım','Fatura','Sağlık','Giyim','Eğlence','Ev','Eğitim','Araba','Kişisel','Diğer'];
const CARSUB=['Yakıt','Bakım','Sigorta','Kasko','Muayene','Lastik','Vergi (MTV)','Otopark / Otoyol','Diğer'];
const catColor=c=>'var(--c'+(((CATS.indexOf(c)<0?11:CATS.indexOf(c))%10)+1)+')';
const ICO={
 home:'<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',card:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6 15h4"/>',
 debt:'<circle cx="12" cy="12" r="9"/><path d="M14.5 9c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.8-2.5 2s1 1.7 2.5 2 2.5.8 2.5 2-1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6v1.5M12 16.5V18"/>',
 grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',
 income:'<path d="M12 19V5M6 11l6-6 6 6"/>',fixed:'<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/>',
 car:'<path d="M5 16V11l2-5h10l2 5v5M3 16h18M7 16v3M17 16v3M7 12h.01M17 12h.01"/>',scen:'<path d="M4 19V5M4 19h16M8 15l4-5 3 3 5-7"/>',
 wallet:'<path d="M4 7h14a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2V7zM4 7l12-3v3M16 13.5h.01"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>'};
const ico=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${ICO[n]}</svg>`;

/* ============ veri ============ */
const KEY='cuzdanim_v1',VER=11;
const emptyData=()=>({v:1,accounts:[],cards:[],tx:[],incomes:[],transfers:[],cardPay:[],debts:[],debtPay:[],recurring:[],recPaid:{},incomeRec:[],incPaid:{},cars:[],gun:[],cfg:{goldPrice:0},meta:{}});
let mem=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(emptyData(),JSON.parse(r))}catch(e){}
  return mem?Object.assign(emptyData(),JSON.parse(mem)):emptyData()}
let S=load();
S.cards.forEach(c=>{if(!c.since){const ds=S.tx.filter(t=>t.src==='card:'+c.id).map(t=>t.date).sort();c.since=ds[0]||iso(new Date())}});
S.debts.forEach(d=>{if(d.type==='gold'&&!d.gold){d.gold={gram:+d.remGrams||0};delete d.remGrams}});
if(S.cfg.goldPrice&&!S.cfg.gold){S.cfg.gold={gram:S.cfg.goldPrice};delete S.cfg.goldPrice}
try{if(!localStorage.getItem(KEY))setTimeout(idbRestore,0)}catch(e){}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('cuzdanim',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()})}
function idbPut(j){try{idbOpen().then(d=>{d.transaction('kv','readwrite').objectStore('kv').put(j,'data')}).catch(()=>{})}catch(e){}}
function idbRestore(){try{idbOpen().then(d=>{const q=d.transaction('kv').objectStore('kv').get('data');q.onsuccess=()=>{if(q.result){try{S=Object.assign(emptyData(),JSON.parse(q.result));render();toast('Verin yedek depodan geri yüklendi')}catch(e){}}}}).catch(()=>{})}catch(e){}}
function persist(){const j=JSON.stringify(S);mem=j;try{localStorage.setItem(KEY,j)}catch(e){}idbPut(j)}
function markBackup(){S.meta=S.meta||{};S.meta.lastBackup=today();persist();render();toast('Yedek alındı')}
function save(){persist();render()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ============ hesaplamalar ============ */
const find=(arr,id)=>arr.find(x=>x.id===id);
const srcName=s=>{if(!s)return '—';const [k,id]=s.split(':');const o=find(k==='card'?S.cards:S.accounts,id);return o?o.name:'(silinmiş)'};
function accBal(a){let b=+a.opening||0;
  S.incomes.forEach(i=>{if(i.acc===a.id)b+=i.amt});
  S.tx.forEach(t=>{if(t.src==='acc:'+a.id)b-=t.amt});
  S.transfers.forEach(t=>{if(t.from===a.id)b-=t.amt;if(t.to===a.id)b+=t.amt});

    return `<rect x="${x}" y="${H-h}" width="${w}" height="${Math.max(h,1)}" rx="5" fill="var(--accent)" opacity="${i?0.75:1}"/><text x="${x+w/2}" y="${H-h-4}" text-anchor="middle">${d.amt?Math.round(d.amt).toLocaleString('tr-TR'):''}</text><text x="${x+w/2}" y="${H+14}" text-anchor="middle">${MS[m]}</text>`}).join('')}</svg>
    <div class="note">Gelecek aylarda kartlarına yansıyacak taksit tutarları (₺).</div>`}

/* ============ öneri motoru ============ */
function advice(){
  const o=[],t=totals(),cm=ymOf(new Date()),up=upcoming(30),fc=freeCash();
  S.cards.forEach((c,i)=>{const x=t.ci[i];
    if(x.closedDebt>0.5){const lb=x.dueIn<0?`${-x.dueIn} gün gecikti`:x.dueIn===0?'son ödeme bugün':x.dueIn+' gün kaldı';
      o.push({l:x.dueIn<=3?'bad':'warn',t:`${c.name}: ekstre ${lb}`,s:`Dönem borcu ${fmt(x.closedDebt)}, asgari ${fmt(x.min)}. Tamamını ödersen faiz işlemez; yalnızca asgariyi ödersen kalan ${fmt(x.carry)} için aylık yaklaşık ${fmt(x.carryInt)} faiz (%${pc(x.rate)}) işler.`,go:'cards'})}
    if(x.util>.8)o.push({l:'bad',t:`${c.name} limiti %${Math.round(x.util*100)} dolu`,s:`Kalan limit ${fmt(x.avail)}. Yeni harcamaları nakit veya banka hesabıyla yapmayı dene.`,go:'cards'});
    if(x.nextEst>0)o.push({l:'info',t:`${c.name}: sonraki ekstre tahmini ${fmt(x.nextEst)}`,s:`Asgari yaklaşık ${fmt(x.nextMin)}. İçinde ${fmt(sum(x.ch.filter(z=>z.idx===x.cur&&z.n>1),z=>z.amt))} taksit var.`,go:'cards'})});
  const need=sum(up.filter(u=>u.out&&u.k!=='card'),u=>u.amt)+sum(t.ci,x=>x.min);
  const surplus=t.cash-need;
  const targets=[...S.cards.map((c,i)=>({n:c.name,b:t.ci[i].currentDebt,r:t.ci[i].rate})),...S.debts.map(d=>({n:d.name,b:debtBal(d),r:d.rate||0}))].filter(x=>x.b>1).sort((a,b)=>b.r-a.r||b.b-a.b);
  if(targets.length&&surplus>500){const g=targets[0],pay=Math.min(surplus,g.b);
    o.push({l:'good',t:`${fmtI(pay)} ile ${g.n} borcunu azalt`,s:`30 günlük zorunlu ödemelerin (${fmtI(need)}) ayrıldıktan sonra nakitte ${fmtI(surplus)} fazla var. ${g.r?`Bu borç ayda %${g.r} faizle işliyor.`:'Önce en pahalı borçtan kapatmak toplam faizi düşürür.'}`,go:'scen'})}
  else if(targets.length&&t.cash>0&&surplus<=0)o.push({l:'warn',t:'Nakit önümüzdeki 30 günün ödemelerine yetmiyor',s:`Gereken ${fmtI(need)}, eldeki ${fmtI(t.cash)}. Harcamaları kıs veya taksitli yeni harcama yapma.`,go:'acc'});
  const inc=fc.inc;
  if(inc>0&&fc.ins/inc>.35)o.push({l:'warn',t:`Gelecek ay taksit yükü gelirinin %${Math.round(fc.ins/inc*100)}'i`,s:`${fmtI(fc.ins)} taksit ödenecek. Yeni taksitli alışverişten önce iki kez düşün.`,go:'cards'});
  if(inc>0)o.push({l:fc.free>0?'info':'bad',t:fc.free>0?`Aylık tahmini boş paran ${fmtI(fc.free)}`:`Aylık gider gelirini ${fmtI(-fc.free)} aşıyor`,s:`Gelir ${fmtI(inc)} − sabit gider ${fmtI(fc.fixed)} − taksit ${fmtI(fc.ins)} − kredi/borç taksiti ${fmtI(fc.debtM)} − ortalama değişken harcama ${fmtI(fc.vari)}.`,go:'scen'});
  const dis=['Yemek','Eğlence','Giyim','Kişisel'],pm=monthParts(cm).filter(p=>!p.tx.rec);
  const dsp=dis.map(c=>[c,sum(pm.filter(p=>p.tx.cat===c),p=>p.amt)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1])[0];
  if(dsp&&targets.length)o.push({l:'info',t:`${dsp[0]} harcaması bu ay ${fmtI(dsp[1])}`,s:`%20 kısarsan ayda ${fmtI(dsp[1]*.2)}, yılda ${fmtI(dsp[1]*.2*12)} borç ödemesine kalır.`,go:'scen'});
  const subs=sum(S.recurring.filter(r=>r.kind==='Abonelik'&&r.active!==false),r=>r.amt);
  if(subs>0)o.push({l:'info',t:`Abonelikler ayda ${fmtI(subs)}, yılda ${fmtI(subs*12)}`,s:'Kullanmadıklarını iptal etmeyi düşün.',go:'fixed'});
  S.cars.forEach(c=>[['inspect','Muayene'],['insurance','Trafik sigortası'],['kasko','Kasko']].forEach(([k,l])=>{if(c[k]){const dd=daysTo(pd(c[k]));if(dd<=30)o.push({l:dd<0?'bad':'warn',t:`${c.name}: ${l} ${dd<0?`${-dd} gün geçti`:dd+' gün sonra'}`,s:'Araba sayfasından tarihi güncelleyebilirsin.',go:'car'})}}));
  S.debts.filter(d=>d.type==='gold'&&goldVal(d)>0).forEach(d=>{const v=goldVal(d);
    o.push({l:'info',t:`${d.name}: ${goldDesc(d)} borcun şu an ${fmtI(v)}`,s:`Altın fiyatı %5 artarsa borcun ${fmtI(v*.05)} büyür. Altın borçları fiyatla birlikte yükselir, mümkünse önce kapat.`,go:'debts'})});
  const od=up.filter(u=>u.out&&daysTo(u.d)<0&&u.k!=='card');if(od.length)o.unshift({l:'bad',t:`${od.length} gecikmiş ödeme var`,s:od.map(u=>u.t).join(', '),go:'fixed'});
  const rank={bad:0,warn:1,good:2,info:3};return o.sort((a,b)=>rank[a.l]-rank[b.l])}

/* ============ harcama ekleme ============ */
function srcOpts(){return [...S.cards.map(c=>['card:'+c.id,c.name]),...S.accounts.map(a=>['acc:'+a.id,a.name])]}
function openExpense(tx,preset={}){
  if(!S.cards.length&&!S.accounts.length){openSheet({title:'Önce bir kaynak ekle',body:'<p class="muted">Harcamanın hangi karttan veya hesaptan çıktığını seçebilmek için en az bir kart ya da nakit/hesap gerekir.</p><div class="btns"><button class="btn pri" data-act="editCardX">Kart ekle</button><button class="btn" data-act="editAccX">Nakit / hesap ekle</button></div>',save:null});return}
  const t=tx||Object.assign({date:today(),cat:preset.cat||'Market',inst:1,src:srcOpts()[0][0]},preset);
  const rec=S.tx.slice().reverse().filter((x,i,a)=>a.findIndex(y=>y.note===x.note&&y.cat===x.cat&&y.src===x.src)===i&&!x.rec).slice(0,5);
  openSheet({title:tx?'Harcamayı düzenle':'Harcama ekle',
   body:`${!tx&&rec.length?`<div class="f"><span>Son harcamalar (dokun, doldur)</span><div class="chips scroll">${rec.map(r=>`<button class="chip" data-act="fill" data-i="${esc(r.id)}">${esc(r.note||r.cat)} · ${fmtI(r.amt)}</button>`).join('')}</div></div>`:''}
   ${fld('x_amt','Tutar (₺)',tx?nv(tx.amt):'',{t:'num',cls:'amtin',ph:'0'})}
   ${fld('x_cat','Kategori',t.cat,{t:'chips',opts:CATS.map(c=>[c,c])})}
   ${fld('x_src','Nereden ödendi?',t.src,{t:'chips',opts:srcOpts()})}
   ${fld('x_inst','Taksit',t.inst||1,{t:'chips',scroll:1,opts:[[1,'Peşin'],...[2,3,4,5,6,8,9,10,12,15,18,24].map(n=>[n,n+' taksit'])]})}
   ${fld('x_car','Araba',t.car||'',{t:'select',opts:[['','Seçilmedi'],...S.cars.map(c=>[c.id,c.name])]})}
   ${fld('x_sub','Araba gideri türü',t.sub||'Yakıt',{t:'chips',opts:CARSUB.map(c=>[c,c])})}
   ${fld('x_km','Kilometre (isteğe bağlı)',t.km||'',{t:'num'})}
   <div class="f2">${fld('x_date','Tarih',t.date,{t:'date'})}${fld('x_note','Not',t.note||'',{ph:'örn. Migros'})}</div>
   <div class="prev" id="x_prev"></div>`,
   hook(){
     const src=V('x_src')||'',isCard=src.startsWith('card:'),amt=N('x_amt'),inst=+V('x_inst')||1;
     showIf('x_inst',isCard);showIf('x_car',V('x_cat')==='Araba'&&S.cars.length>0);showIf('x_sub',V('x_cat')==='Araba');showIf('x_km',V('x_cat')==='Araba'&&V('x_sub')==='Yakıt'&&S.cars.length>0);
     const p=$('#x_prev');p.className='prev';
     if(isCard){const c=find(S.cards,src.slice(5)),i=cardInfo(c),si=c.since?stmtIdx(c,c.since):-1e9,base=stmtIdx(c,V('x_date')||today());
       let settled=0;for(let k=0;k<inst;k++)if(base+k<si)settled++;
       const eff=amt/inst*(inst-settled),oldEff=tx&&tx.src===src?tx.amt/(tx.inst||1)*((tx.inst||1)-(()=>{let n=0;const b=stmtIdx(c,tx.date);for(let k=0;k<(tx.inst||1);k++)if(b+k<si)n++;return n})()):0;
       p.innerHTML=amt>0?`${inst>1?`<b>${inst} × ${fmt(amt/inst)}</b> · `:''}Bu harcama ${esc(c.name)} kartının <b>${ymLabel(base)}</b> ekstresinden itibaren yansır.${settled>0?`<br><b>${settled}</b> taksit takip başlangıcından önce olduğu için ödenmiş sayılır. Borca ve limite <b>${inst-settled}</b> taksit (${fmtI(eff)}) yansır.`:''}<br>Kalan limit: ${fmtI(i.avail)} → <b>${fmtI(i.avail+oldEff-eff)}</b>`:'Tutarı yaz; ekstreye etkisini burada göreceksin.';
       if(i.avail+oldEff-eff<0&&!tx)p.classList.add('bad')}
     else{const a=find(S.accounts,src.slice(4));if(a){const b=accBal(a);p.innerHTML=amt>0?`${esc(a.name)} bakiyesi: ${fmtI(b)} → <b>${fmtI(b-amt+(tx&&tx.src===src?tx.amt:0))}</b>`:`${esc(a.name)} bakiyesi: ${fmtI(b)}`;if(b-amt<0)p.classList.add('warn')}}
   },
   save(){const amt=N('x_amt');if(!(amt>0)){toast('Tutarı gir');return false}
     const o={id:tx?tx.id:uid(),amt,cat:V('x_cat'),src:V('x_src'),date:V('x_date')||today(),note:V('x_note').trim(),inst:V('x_src').startsWith('card:')?(+V('x_inst')||1):1};
     if(o.cat==='Araba'){o.sub=V('x_sub');if(V('x_car'))o.car=V('x_car');const km=N('x_km');if(km>0){o.km=km;const c=find(S.cars,o.car);if(c&&km>(c.km||0))c.km=km}}
     if(tx&&tx.rec)o.rec=tx.rec;
     if(tx)Object.assign(tx,o);else S.tx.push(o);persist();
     const s=o.src;let m='Kaydedildi';if(s.startsWith('card:')){const c=find(S.cards,s.slice(5)),i=cardInfo(c);m=`${c.name}: güncel borç ${fmtI(i.currentDebt)}, kalan limit ${fmtI(i.avail)}`}
     render();toast(m)},
   del:tx?()=>{const i=S.tx.indexOf(tx);S.tx.splice(i,1);Object.keys(S.recPaid).forEach(k=>{if(S.recPaid[k]===tx.id){delete S.recPaid[k];(S.recSkip=S.recSkip||{})[k]=1}});save();toast('Silindi')}:null});
}
A.fill=d=>{const r=find(S.tx,d.i);if(!r)return;setV('x_amt',nv(r.amt));setV('x_cat',r.cat);setV('x_src',r.src);setV('x_note',r.note||'');setV('x_inst',r.inst||1);if(hook)hook()};

function vSpend(){
  const m=ui.month,ps=monthParts(m).sort((a,b)=>pd(b.tx.date)-pd(a.tx.date)||0);
  const f=ui.filter,list=f==='all'?ps:ps.filter(p=>p.tx.src===f);
  const tot=sum(list,p=>p.amt),inc=monthIncome(m);
  const cat={};list.forEach(p=>cat[p.tx.cat]=(cat[p.tx.cat]||0)+p.amt);
  const cats=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  const row=p=>`<button class="row" data-act="editTx" data-id="${p.tx.id}"><span class="dot" style="background:${catColor(p.tx.cat)}"></span><div class="mid"><div class="t">${esc(p.tx.note||p.tx.cat)}${p.tx.sub?` <span class="muted">· ${esc(p.tx.sub)}</span>`:''}</div><div class="s">${p.tx.cat} · ${dshort(pd(p.tx.date))} · ${esc(srcName(p.tx.src))}${p.n>1?` · <b>${p.k+1}/${p.n}. taksit</b>`:''}</div></div><div class="amt num">${fmt(p.amt)}${p.n>1?`<small>toplam ${fmtI(p.tx.amt)}</small>`:''}</div></button>`;
  let body='';

  else if(ui.group==='card'){const keys=[...new Set(list.map(p=>p.tx.src))].sort();
    body=keys.map(k=>{const g=list.filter(p=>p.tx.src===k),c={};g.forEach(p=>c[p.tx.cat]=(c[p.tx.cat]||0)+p.amt);
      return `<div class="card"><div class="row" style="border:0;padding-top:0"><div class="mid"><div class="t">${esc(srcName(k))}</div><div class="s">${Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([n,v])=>n+' '+fmtI(v)).join(' · ')}</div></div><div class="amt num">${fmtI(sum(g,p=>p.amt))}</div></div>${g.map(row).join('')}</div>`}).join('')}

  else body=`<div class="card">${list.map(row).join('')}</div>`;

  <div class="grid3"><div class="kpi"><span>Harcama</span><b class="num">${fmtI(tot)}</b></div><div class="kpi"><span>Gelir</span><b class="num good">${fmtI(inc)}</b></div><div class="kpi"><span>Fark</span><b class="num ${inc-tot<0?'bad':'good'}">${fmtI(inc-tot)}</b></div></div>
  <section><div class="chips scroll"><button class="chip ${f==='all'?'on':''}" data-act="flt" data-v="all">Tümü</button>${srcOpts().map(([v,l])=>`<button class="chip ${f===v?'on':''}" data-act="flt" data-v="${v}">${esc(l)}</button>`).join('')}</div>
  <div class="chips" style="margin-top:8px">${[['day','Güne göre'],['card','Karta göre'],['cat','Kategoriye göre']].map(([v,l])=>`<button class="chip ${ui.group===v?'on':''}" data-act="grp" data-v="${v}">${l}</button>`).join('')}</div></section>
  ${cats.length?`<section><h2>Kategoriler</h2><div class="card">${cats.slice(0,6).map(([n,v])=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${n}</span><b class="num">${fmtI(v)}</b></div><div class="bar"><i style="width:${v/cats[0][1]*100}%;background:${catColor(n)}"></i></div></div>`).join('')}</div></section>`:''}

const sc={extra:0,lump:0,strat:'avalanche'};
function simDebts(){const o=[];S.cards.forEach(c=>{const i=cardInfo(c);if(i.currentDebt>1)o.push({n:c.name,bal:i.currentDebt,rate:i.rate,kind:'card',pct:i.minRate/100})});
  S.debts.forEach(d=>{const b=debtBal(d);if(b>1)o.push({n:d.name,bal:b,rate:d.rate||0,kind:'fixed',min:d.monthly||0})});return o}
function simulate(ds,extra,strat,lump,roll){
  const d=ds.map(x=>({...x}));let months=0,interest=0;const hist=[sum(d,x=>x.bal)];
  const ord=()=>d.filter(x=>x.bal>.5).sort(strat==='avalanche'?(a,b)=>b.rate-a.rate||a.bal-b.bal:(a,b)=>a.bal-b.bal);
  const minOf=x=>x.kind==='card'?Math.min(x.bal,Math.max(x.bal*x.pct,Math.min(x.bal,100))):Math.min(x.bal,x.min);
  const apply=amt=>{for(const x of ord()){if(amt<=0)break;const p=Math.min(x.bal,amt);x.bal-=p;amt-=p}};
  if(lump>0)apply(lump);hist[0]=sum(d,x=>x.bal);
  const m0={};d.forEach(x=>m0[x.n]=x.kind==='card'?x.bal*x.pct:x.min);
  while(sum(d,x=>x.bal)>.5&&months<600){months++;
    d.forEach(x=>{if(x.bal>0){const i=x.bal*x.rate/100;x.bal+=i;interest+=i}});
    let freed=0;d.forEach(x=>{if(x.bal<=.5)freed+=roll?m0[x.n]||0:0});
    d.forEach(x=>{if(x.bal>.5)x.bal-=minOf(x)});
    if(roll)apply(extra+freed);
    hist.push(sum(d,x=>x.bal));
    if(months>=12&&hist[months]>=hist[months-12]*.999&&hist[months]>0&&months>=24)break}
  const ok=sum(d,x=>x.bal)<=.5;return {months:ok?months:null,interest,hist,ok}}
const mLab=m=>m==null?'Bitmiyor':m<12?m+' ay':Math.floor(m/12)+' yıl'+(m%12?' '+m%12+' ay':'');

  ${fld('s_lump','Şimdi tek seferlik ödeme (₺)',nv(sc.lump),{t:'num'})}${fld('s_strat','Yöntem',sc.strat,{t:'chips',opts:[['avalanche','Çığ: en yüksek faiz önce'],['snowball','Kartopu: en küçük borç önce']]})}
